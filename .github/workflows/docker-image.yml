name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (leave empty to use the app version)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/yeomai-lore-web"
          version="$(node -p "require('./apps/web/version.json').version")"
          tag="${REQUESTED_TAG:-$version}"
          if [[ ! "$tag" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          echo "IMAGE_NAME=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show published image
        run: |
          {
            echo "### Docker image published"
            echo
            echo '```'
            echo "${IMAGE_NAME}:${IMAGE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
